name: 自动同步到CNB.COOL

on:
  workflow_dispatch:        # 手动触发
    inputs:
      days:
        description: '保留最近多少天的工作流运行记录（更早的将被自动删除）'
        required: false
        default: '1'
        type: string
  schedule:                 # 定时触发（每6小时）
    - cron: '0 */6 * * *'

# ======================================================
# 任务一：清理旧的工作流运行记录
# ======================================================
jobs:
  cleanup-old-runs:
    name: 清理旧工作流运行记录
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: 删除超过指定天数的工作流运行记录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          DAYS: ${{ inputs.days || '1' }}
        run: |
          echo "==============================================="
          echo "清理旧工作流运行记录"
          echo "工作流名称: ${WORKFLOW_NAME}"
          echo "保留天数  : ${DAYS} 天"
          echo "开始时间  : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "==============================================="

          CUTOFF=$(date -u -d "${DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "删除 ${CUTOFF} 之前的运行记录"
          echo ""

          WORKFLOW_ID=$(gh api "repos/${REPO}/actions/workflows" --paginate \
            --jq ".workflows[] | select(.name == \"${WORKFLOW_NAME}\") | .id" | head -1)

          if [ -z "${WORKFLOW_ID}" ]; then
            echo "⚠️ 未找到工作流: ${WORKFLOW_NAME}，跳过清理"
            exit 0
          fi
          echo "工作流 ID: ${WORKFLOW_ID}"
          echo ""

          RUN_IDS=$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW_ID}/runs" --paginate \
            --jq ".workflow_runs[] | select(.created_at < \"${CUTOFF}\") | .id")

          if [ -z "${RUN_IDS}" ]; then
            echo "✅ 没有需要删除的运行记录"
            exit 0
          fi

          DELETED=0
          FAILED=0
          TOTAL=$(echo "${RUN_IDS}" | wc -l | tr -d ' ')
          echo "共找到 ${TOTAL} 条待删除记录"
          echo ""

          for id in ${RUN_IDS}; do
            if gh api -X DELETE "repos/${REPO}/actions/runs/${id}" 2>/dev/null; then
              echo "✅ 已删除运行记录 ID: ${id}"
              DELETED=$((DELETED + 1))
            else
              echo "❌ 删除失败运行记录 ID: ${id}"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "==============================================="
          echo "清理完成：成功 ${DELETED} 条 / 失败 ${FAILED} 条 / 总计 ${TOTAL} 条"
          echo "结束时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "==============================================="

  # ======================================================
  # 任务二：同步仓库到 CNB.COOL
  # ======================================================
  sync-to-cnb:
    name: 同步 ${{ matrix.repo.source }} → ${{ matrix.repo.target }}
    runs-on: ubuntu-latest
    needs: cleanup-old-runs

    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(vars.CNB_SYNC_REPOS) }}

    steps:
      # ---------- 0. 初始化日志 ----------
      - name: 输出任务开始信息
        run: |
          LOG="${RUNNER_TEMP}/sync.log"
          {
            echo "==============================================="
            echo "任务开始: 自动同步到 CNB.COOL"
            echo "源仓库  : ${{ matrix.repo.source }}"
            echo "目标仓库: cnb.cool/${{ matrix.repo.target }}.git"
            echo "触发事件: ${{ github.event_name }}"
            echo "触发者  : ${{ github.actor }}"
            echo "运行编号: ${{ github.run_number }}"
            echo "开始时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "运行环境: $(uname -a)"
            echo "==============================================="
          } | tee "${LOG}"
          echo "日志文件: ${LOG}" | tee -a "${LOG}"

      # ---------- 1. 诊断：校验所有 Secret 是否已配置 ----------
      - name: 校验 Secret 配置（诊断）
        env:
          GH_PRIVATE_TOKEN: ${{ secrets.GH_PRIVATE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          LOG="${RUNNER_TEMP}/sync.log"
          echo "" | tee -a "${LOG}"
          echo "----- Secret 配置诊断 -----" | tee -a "${LOG}"
          echo "GITHUB_TOKEN     长度: ${#GITHUB_TOKEN}" | tee -a "${LOG}"
          echo "GH_PRIVATE_TOKEN 长度: ${#GH_PRIVATE_TOKEN}" | tee -a "${LOG}"
          echo "CNB_TOKEN        长度: ${#CNB_TOKEN}" | tee -a "${LOG}"

          if [ -z "${GH_PRIVATE_TOKEN}" ]; then
            echo "" | tee -a "${LOG}"
            echo "⚠️ 警告: GH_PRIVATE_TOKEN 为空！" | tee -a "${LOG}"
            echo "   私有仓库同步将失败，请在仓库设置中创建该 Secret。" | tee -a "${LOG}"
          fi
          if [ -z "${CNB_TOKEN}" ]; then
            echo "" | tee -a "${LOG}"
            echo "❌ 错误: CNB_TOKEN 为空，无法推送到 CNB。" | tee -a "${LOG}"
            exit 1
          fi
          echo "✅ Secret 检查通过" | tee -a "${LOG}"

      # ---------- 2. 预探测默认 TOKEN 是否有权访问源仓库 ----------
      - name: 探测默认 TOKEN 可访问性
        id: probe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="${RUNNER_TEMP}/sync.log"
          echo "" | tee -a "${LOG}"
          echo "----- 探测默认 TOKEN 可访问性 -----" | tee -a "${LOG}"
          if gh api "repos/${{ matrix.repo.source }}" --silent > /dev/null 2>&1; then
            echo "✅ 默认 GITHUB_TOKEN 可访问该仓库" | tee -a "${LOG}"
          else
            echo "⚠️ 默认 GITHUB_TOKEN 无法访问，将使用私有 TOKEN" | tee -a "${LOG}"
            exit 1
          fi

      # ---------- 3. 检出（默认 TOKEN） ----------
      - name: 检出原仓库（默认 GITHUB_TOKEN）
        id: checkout_default
        if: steps.probe.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo.source }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      # ---------- 4. 检出（私有 TOKEN） ----------
      - name: 检出原仓库（私有仓库 TOKEN）
        id: checkout_private
        if: steps.probe.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo.source }}
          token: ${{ secrets.GH_PRIVATE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      # ---------- 5. 检查检出结果 ----------
      - name: 检查检出结果
        run: |
          LOG="${RUNNER_TEMP}/sync.log"
          PROBE="${{ steps.probe.outcome }}"
          DEFAULT="${{ steps.checkout_default.outcome }}"
          PRIVATE="${{ steps.checkout_private.outcome }}"

          echo "" | tee -a "${LOG}"
          echo "----- 检出结果 -----" | tee -a "${LOG}"
          echo "默认可访问性探测 : ${PROBE}" | tee -a "${LOG}"
          echo "默认 TOKEN 检出  : ${DEFAULT}" | tee -a "${LOG}"
          echo "私有 TOKEN 检出  : ${PRIVATE}" | tee -a "${LOG}"

          if [ "${DEFAULT}" = "success" ]; then
            echo "检出方式 : 默认 GITHUB_TOKEN" | tee -a "${LOG}"
          elif [ "${PRIVATE}" = "success" ]; then
            echo "检出方式 : 私有仓库 TOKEN (GH_PRIVATE_TOKEN)" | tee -a "${LOG}"
          else
            echo "" | tee -a "${LOG}"
            echo "❌ 两种 Token 均无法访问仓库: ${{ matrix.repo.source }}" | tee -a "${LOG}"
            echo "" | tee -a "${LOG}"
            echo "排查建议：" | tee -a "${LOG}"
            echo "  1. 仓库路径拼写是否正确（大小写敏感）" | tee -a "${LOG}"
            echo "  2. GITHUB_TOKEN 默认无法跨仓库访问，属正常现象" | tee -a "${LOG}"
            echo "  3. GH_PRIVATE_TOKEN 是否已创建且非空" | tee -a "${LOG}"
            echo "  4. Classic PAT: 需勾选 repo 权限" | tee -a "${LOG}"
            echo "  5. Fine-grained PAT: 需勾选 Contents: Read + Metadata: Read" | tee -a "${LOG}"
            echo "  6. Fine-grained PAT: 需把该仓库加入可访问列表" | tee -a "${LOG}"
            echo "  7. 组织是否启用了 SAML SSO，Token 需额外授权" | tee -a "${LOG}"
            exit 1
          fi

      # ---------- 6. 输出仓库统计信息 ----------
      - name: 输出仓库统计信息
        run: |
          LOG="${RUNNER_TEMP}/sync.log"
          echo "当前分支 : $(git branch --show-current)" | tee -a "${LOG}"
          echo "最新提交 : $(git log -1 --oneline)" | tee -a "${LOG}"
          echo "提交总数 : $(git rev-list --count HEAD)" | tee -a "${LOG}"
          echo "分支数量 : $(git branch -r | wc -l)" | tee -a "${LOG}"
          echo "工作区大小: $(du -sh .git | cut -f1)" | tee -a "${LOG}"

      # ---------- 7. 配置 Git 用户 ----------
      - name: 配置 Git 用户信息
        run: |
          LOG="${RUNNER_TEMP}/sync.log"
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "Git 用户已配置: github-actions[bot]" | tee -a "${LOG}"

      # ---------- 8. 同步分支到 CNB.COOL ----------
      - name: 同步分支到 CNB.COOL
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          TARGET_REPO: ${{ matrix.repo.target }}
          GH_TOKEN: ${{ secrets.GH_PRIVATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP}/sync.log"
          echo "" | tee -a "${LOG}"
          echo "----- 开始推送到 CNB.COOL -----" | tee -a "${LOG}"
          echo "目标地址: https://cnb.cool/${TARGET_REPO}.git" | tee -a "${LOG}"
          echo "认证用户: cnb" | tee -a "${LOG}"

          # 构造 GitHub 认证头（checkout 的 persist-credentials: false 不保存凭证）
          GH_AUTH=$(printf '%s' "x-access-token:${GH_TOKEN}" | base64 -w0)
          GH_HEADER="Authorization: basic ${GH_AUTH}"

          echo ">> 抓取远程分支引用..." | tee -a "${LOG}"
          git -c http.extraheader="${GH_HEADER}" \
            fetch --prune origin "+refs/heads/*:refs/remotes/origin/*" 2>&1 | tee -a "${LOG}"

          # 检查是否有分支可推送
          if [ -z "$(git for-each-ref refs/remotes/origin --format='%(refname)')" ]; then
            echo "⚠️ 无远程分支，跳过推送" | tee -a "${LOG}"
            exit 0
          fi

          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/${TARGET_REPO}.git"

          echo "" | tee -a "${LOG}"
          echo ">> 推送所有分支（--prune 删除多余分支，不推送标签）..." | tee -a "${LOG}"
          if git push cnb --prune --force --no-tags "refs/remotes/origin/*:refs/heads/*" 2>&1 | tee -a "${LOG}"; then
            echo "✅ 分支推送成功" | tee -a "${LOG}"
          else
            echo "❌ 分支推送失败" | tee -a "${LOG}"
            exit 1
          fi

          echo "完成时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" | tee -a "${LOG}"

      # ---------- 9. 输出日志到工作流页面 ----------
      - name: 输出日志至工作流页面
        if: always()
        run: |
          LOG="${RUNNER_TEMP}/sync.log"
          {
            echo ""
            echo "---"
            echo ""
            echo "## 📋 同步日志：\`${{ matrix.repo.source }}\` → \`${{ matrix.repo.target }}\`"
            echo ""
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| 默认可访问性探测 | ${{ steps.probe.outcome }} |"
            echo "| 默认 TOKEN 检出 | ${{ steps.checkout_default.outcome }} |"
            echo "| 私有 TOKEN 检出 | ${{ steps.checkout_private.outcome }} |"
            echo "| 作业状态 | ${{ job.status }} |"
            echo ""
            echo "<details><summary>展开完整日志</summary>"
            echo ""
            echo '```text'
            if [ -f "${LOG}" ]; then
              cat "${LOG}"
            else
              echo "（无日志记录）"
            fi
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- 10. 清理缓存与临时文件 ----------
      - name: 清理缓存和临时文件
        if: always()
        run: |
          echo "----- 开始清理 -----"
          git remote remove cnb 2>/dev/null || true
          echo "已移除远程 cnb"
          git config --global --unset user.name  2>/dev/null || true
          git config --global --unset user.email 2>/dev/null || true
          echo "已清理 Git 全局配置"
          rm -f "${RUNNER_TEMP}/sync.log"
          rm -rf "${RUNNER_TEMP:?}"/*  2>/dev/null || true
          echo "已清理临时目录: ${RUNNER_TEMP}"
          git clean -fdx 2>/dev/null || true
          echo "已清理工作区"
          echo "✅ 清理完成"
